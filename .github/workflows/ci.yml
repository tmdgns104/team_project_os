name: Team Project OS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile
        run: python -m py_compile app/main.py app/conversation.py local_bridge/providers.py local_bridge/bridge.py local_bridge/project_cli.py project_os.py tools/simulate_design_session.py tools/simulate_autofill_project.py
      - name: Full regression including provider simulations
        run: python -m unittest discover -s tests -v
      - name: Design Session materialization simulator
        run: python tools/simulate_design_session.py
      - name: Provisional Autofill materialization simulator
        run: python tools/simulate_autofill_project.py
      - name: CLI help smoke
        run: |
          python local_bridge/bridge.py -h
          python project_os.py -h
          python project_os.py design -h
          python project_os.py create -h
      - name: JavaScript syntax
        run: node --check app/static/app.js
