name: Package Team Project OS v0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-v07.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean package
        run: |
          rm -rf .git .github __pycache__
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: team_project_os_v0.7_verified
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
