name: Bootstrap Team Project OS source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap_chunks/part_* > /tmp/team_project_os.b64
          base64 --decode /tmp/team_project_os.b64 > /tmp/team_project_os.zip
          mkdir -p /tmp/team_project_os_unpack
          unzip -q /tmp/team_project_os.zip -d /tmp/team_project_os_unpack
          cp -a /tmp/team_project_os_unpack/team_project_os_v1/. .
          rm -rf .bootstrap_chunks

      - name: Verify restored source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/main.py
          test -f app/static/index.html
          test -f app/static/app.js
          test -f app/static/styles.css
          test -f local_bridge/bridge.py
          test -f requirements.txt
          python -m py_compile app/main.py local_bridge/bridge.py tests/test_smoke.py

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'add complete Team Project OS V1 source [skip ci]'
          git push
