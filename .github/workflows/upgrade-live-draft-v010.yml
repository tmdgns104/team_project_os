name: Upgrade Live Design Draft V0.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-live-draft-v010.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make upgrade patch resilient
        run: python scripts/fix_upgrade_v010.py
      - name: Apply V0.10 upgrade
        run: python scripts/upgrade_live_draft_v010.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python
        run: python -m py_compile app/main.py app/conversation.py local_bridge/providers.py local_bridge/bridge.py local_bridge/project_cli.py project_os.py tools/simulate_design_session.py tools/simulate_autofill_project.py tools/simulate_live_design.py tests/test_live_design.py
      - name: Full regression
        run: python -m unittest discover -s tests -v
      - name: Design Session simulator
        run: python tools/simulate_design_session.py
      - name: Autofill simulator
        run: python tools/simulate_autofill_project.py
      - name: Live Draft simulator
        run: python tools/simulate_live_design.py
      - name: CLI smoke
        run: |
          python project_os.py design -h
          python project_os.py create -h
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Commit V0.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/static/app.js local_bridge/project_cli.py tests/test_live_design.py tools/simulate_live_design.py .github/workflows/ci.yml README.md docs/DESIGN_SESSION.md docs/LIVE_DRAFT.md
          git commit -m 'add live AI design draft synchronization V0.10 [skip ci]'
          git push

# retry after generated-source escaping fix
