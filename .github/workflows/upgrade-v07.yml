name: Upgrade Team Project OS v0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v07.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified V0.7 payload
        shell: bash
        run: |
          cat .upgrade_v07/part_* > /tmp/v07.b64
          test "$(wc -c < /tmp/v07.b64)" -eq 20548
          base64 -d /tmp/v07.b64 > /tmp/v07.zip
          echo '92d8bd10e8cf41e2f442e3d80ec98a913bdc2eafa712412a3e4ebcf30b917966  /tmp/v07.zip' | sha256sum -c -
          unzip -o /tmp/v07.zip -d .

      - name: Update version and documentation
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('app/main.py'); s=p.read_text(encoding='utf-8').replace('version=\"0.6.0\"','version=\"0.7.0\"').replace('\"version\": \"0.6.0\"','\"version\": \"0.7.0\"'); p.write_text(s,encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('README.md'); s=p.read_text(encoding='utf-8'); s=s.replace('# Team Project OS V0.2','# Team Project OS V0.7',1) if s.startswith('# Team Project OS V0.2') else s; p.write_text(s,encoding='utf-8')"
          if ! grep -q '## V0.7 - Provider Adapter 안정화 + CMD 프로젝트 생성' README.md; then
            cat >> README.md <<'EOF'

---

## V0.7 - Provider Adapter 안정화 + CMD 프로젝트 생성

V0.7부터 Local AI 실행은 Provider별 Adapter로 분리합니다. 긴 프로젝트 Prompt 전체를 Windows 명령줄 인자로 직접 넣지 않습니다.

| Provider | 긴 Prompt 전달 방식 | 기본 명령 |
|---|---|---|
| Codex | stdin | `codex exec --skip-git-repo-check -` |
| Claude Code | stdin + 짧은 `-p` 지시 | `claude -p ... --output-format text` |
| OpenCode | 임시 UTF-8 prompt 파일 + 짧은 run 지시 | `opencode run ...` |
| Antigravity CLI | 임시 UTF-8 prompt 파일 + headless print | `agy -p ... --output-format text` |

CMD에서 웹을 거치지 않고 AI와 바로 프로젝트를 시작할 수 있습니다.

```bat
python project_os.py doctor
python project_os.py server
python project_os.py create --provider codex --server http://localhost:8000 --member "승훈"
```

대화 중 `/status`, `/apply`, `/quit`을 사용할 수 있습니다. `--provider`를 `claude`, `opencode`, `antigravity`로 바꾸면 같은 인터페이스를 사용합니다.

CI는 Ubuntu와 Windows에서 가짜 Provider 실행 파일을 실제 subprocess로 실행해 한글/공백/여러 줄 Prompt 보존, Windows `.cmd` wrapper, stdout/stderr 분리, 구조화 JSON round-trip, CMD 프로젝트 생성 흐름을 검증합니다.
EOF
          fi
          grep -qxF '.team_project_os_tmp/' .gitignore || printf '\n.team_project_os_tmp/\n' >> .gitignore

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify V0.7 before commit
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile app/main.py app/conversation.py local_bridge/providers.py local_bridge/bridge.py local_bridge/project_cli.py project_os.py
          python -m unittest discover -s tests -v
          python local_bridge/bridge.py -h
          python project_os.py -h
          node --check app/static/app.js

      - name: Remove upgrade transport and commit source
        shell: bash
        run: |
          rm -rf .upgrade_v07
          rm -f .github/workflows/upgrade-v07.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'add provider adapters and CMD project creation'
          git push
