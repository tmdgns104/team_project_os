name: Upgrade Team Project OS v0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v07.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified V0.7 payload
        shell: bash
        run: |
          cat .upgrade_v07/part_* > /tmp/v07.b64
          test "$(wc -c < /tmp/v07.b64)" -eq 20548
          base64 -d /tmp/v07.b64 > /tmp/v07.zip
          echo '92d8bd10e8cf41e2f442e3d80ec98a913bdc2eafa712412a3e4ebcf30b917966  /tmp/v07.zip' | sha256sum -c -
          unzip -o /tmp/v07.zip -d .

      - name: Update version and documentation
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('app/main.py'); s=p.read_text(encoding='utf-8').replace('version=\"0.6.0\"','version=\"0.7.0\"').replace('\"version\": \"0.6.0\"','\"version\": \"0.7.0\"'); p.write_text(s,encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('README.md'); s=p.read_text(encoding='utf-8'); s=s.replace('# Team Project OS V0.2','# Team Project OS V0.7',1) if s.startswith('# Team Project OS V0.2') else s; p.write_text(s,encoding='utf-8')"
          if ! grep -q '## V0.7 - Provider Adapter 안정화 + CMD 프로젝트 생성' README.md; then
            python -c "from pathlib import Path; import base64; p=Path('README.md'); p.write_text(p.read_text(encoding='utf-8') + base64.b64decode('').decode('utf-8'), encoding='utf-8')"
          fi
          grep -qxF '.team_project_os_tmp/' .gitignore || printf '\n.team_project_os_tmp/\n' >> .gitignore

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify V0.7 before commit
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile app/main.py app/conversation.py local_bridge/providers.py local_bridge/bridge.py local_bridge/project_cli.py project_os.py
          python -m unittest discover -s tests -v
          python local_bridge/bridge.py -h
          python project_os.py -h
          node --check app/static/app.js

      - name: Remove upgrade transport and commit source
        shell: bash
        run: |
          rm -rf .upgrade_v07
          rm -f .github/workflows/upgrade-v07.yml
          rm -f .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'add provider adapters and CMD project creation'
          git push
