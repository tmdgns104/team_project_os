name: Upgrade Team Project OS v0.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v03.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.3 changes
        run: python scripts/upgrade_v03.py

      - name: Verify v0.3
        run: |
          python -m py_compile app/main.py local_bridge/bridge.py tests/*.py
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check app/static/app.js
          grep -q 'Traceability' app/static/index.html
          grep -q 'export/documents.zip' app/main.py

      - name: Commit v0.3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app README.md tests
          git commit -m 'add traceability project setup and document export [skip ci]'
          git push
