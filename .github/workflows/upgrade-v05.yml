name: Upgrade Team Project OS v0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v05.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.5 conversational setup changes
        run: python scripts/upgrade_v05.py

      - name: Verify v0.5
        run: |
          python -m py_compile app/main.py app/project_intake.py app/conversation.py local_bridge/bridge.py tests/*.py
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check app/static/app.js
          grep -q 'AI Project Assistant' app/static/index.html
          grep -q '/api/conversations/start' app/main.py
          grep -q 'assistant-register' local_bridge/bridge.py
          grep -q 'Conversational Project Setup (V0.5)' README.md

      - name: Commit v0.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app local_bridge README.md tests
          git commit -m 'add conversational AI project setup and document authoring [skip ci]'
          git push
