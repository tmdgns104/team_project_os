name: Finalize Professional Documents V0.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-professional-docs-v011.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V0.11 finalizer
        run: python scripts/finalize_professional_documents_v011.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile
        run: python -m py_compile app/main.py app/project_intake.py tests/test_professional_documents.py tests/test_professional_doc_migration.py
      - name: Full regression
        run: python -m unittest discover -s tests -v
      - name: Design Session simulator
        run: python tools/simulate_design_session.py
      - name: Autofill simulator
        run: python tools/simulate_autofill_project.py
      - name: Live Draft simulator
        run: python tools/simulate_live_design.py
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Commit final V0.11 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py tests/test_professional_doc_migration.py
          git commit -m 'finalize V0.11 professional document migration [skip ci]'
          git push
