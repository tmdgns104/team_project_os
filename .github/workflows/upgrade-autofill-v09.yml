name: Upgrade Provisional Autofill V0.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-autofill-v09.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply autofill upgrade
        run: python scripts/upgrade_autofill_v09.py
      - name: Syntax validation
        run: python -m py_compile local_bridge/project_cli.py project_os.py
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local_bridge/project_cli.py project_os.py
          git commit -m 'add provisional autofill mode to AI design sessions [skip ci]'
          git push
