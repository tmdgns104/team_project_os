name: Upgrade Milestone Gantt V0.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-milestone-v013.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply milestone Gantt upgrade
        run: python scripts/upgrade_milestone_gantt_v013.py
      - name: Integrate milestone regression checks
        run: python scripts/finalize_milestone_gantt_v013.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile
        run: python -m py_compile app/main.py app/project_intake.py tools/simulate_milestone_gantt_v013.py tests/test_professional_doc_migration.py
      - name: Full Python regression
        run: python -m unittest discover -s tests -v
      - name: Diagram readability
        run: node tests/test_diagram_layout.js
      - name: Milestone Gantt renderer
        run: node tests/test_milestone_gantt.js
      - name: Existing project creation E2E
        run: python tools/simulate_project_creation_v012.py
      - name: Milestone project creation E2E
        run: python tools/simulate_milestone_gantt_v013.py
      - name: JavaScript syntax
        run: |
          node --check app/static/diagram_layout.js
          node --check app/static/milestone_gantt.js
          node --check app/static/app.js
      - name: Commit V0.13 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/project_intake.py app/static/index.html app/static/app.js app/static/styles.css README.md tests/test_professional_doc_migration.py
          git commit -m 'integrate development milestone Gantt V0.13 [skip ci]'
          git push
