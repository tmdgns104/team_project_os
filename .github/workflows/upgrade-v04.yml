name: Upgrade Team Project OS v0.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v04.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.4 universal intake changes
        run: python scripts/upgrade_v04.py

      - name: Verify v0.4
        run: |
          python -m py_compile app/main.py app/project_intake.py local_bridge/bridge.py tests/*.py
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check app/static/app.js
          grep -q 'project-intake/preview' app/main.py
          grep -q '작성 품질 점검' app/static/app.js
          grep -q '범용 프로젝트' app/project_intake.py

      - name: Commit v0.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app README.md tests
          git commit -m 'add universal guided project setup and intake simulation [skip ci]'
          git push
