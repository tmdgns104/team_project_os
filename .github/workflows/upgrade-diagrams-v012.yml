name: Upgrade Human-readable Diagrams V0.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-diagrams-v012.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V0.12 diagram upgrade
        run: python scripts/upgrade_diagram_ui_v012.py
      - name: Update version regression for V0.12
        run: >-
          python -c "from pathlib import Path; p=Path('tests/test_professional_doc_migration.py'); s=p.read_text(encoding='utf-8').replace('def test_version_is_v011(self):','def test_version_is_v012(self):').replace('self.assertEqual(app.version, \"0.11.0\")','self.assertEqual(app.version, \"0.12.0\")'); p.write_text(s,encoding='utf-8')"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile
        run: python -m py_compile app/main.py tools/simulate_project_creation_v012.py tests/test_professional_doc_migration.py
      - name: Full Python regression
        run: python -m unittest discover -s tests -v
      - name: Diagram layout readability tests
        run: node tests/test_diagram_layout.js
      - name: Existing Design Session simulator
        run: python tools/simulate_design_session.py
      - name: Existing Autofill simulator
        run: python tools/simulate_autofill_project.py
      - name: Existing Live Draft simulator
        run: python tools/simulate_live_design.py
      - name: Full project + documents + diagrams simulator
        run: python tools/simulate_project_creation_v012.py
      - name: JavaScript syntax
        run: |
          node --check app/static/diagram_layout.js
          node --check app/static/app.js
      - name: Commit V0.12 feature integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/static/index.html app/static/app.js app/static/styles.css README.md tests/test_professional_doc_migration.py
          git commit -m 'integrate human-readable design diagrams V0.12 [skip ci]'
          git push
