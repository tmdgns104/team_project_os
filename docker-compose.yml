services:
  project-os:
    build: .
    init: true
    ports:
      - "8000:8000"
    environment:
      PROJECT_OS_ENV: production
      APP_ACCESS_KEY: ${APP_ACCESS_KEY:?Set APP_ACCESS_KEY to a random value with at least 32 characters}
      PROJECT_OS_ALLOWED_HOSTS: ${PROJECT_OS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PROJECT_OS_DB: /data/project_os.db
      PROJECT_OS_SEED_DEMO: ${PROJECT_OS_SEED_DEMO:-0}
      PROJECT_OS_MAX_REQUEST_BYTES: ${PROJECT_OS_MAX_REQUEST_BYTES:-2000000}
    volumes:
      - project_os_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  project_os_data:
